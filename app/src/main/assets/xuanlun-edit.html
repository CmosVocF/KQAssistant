<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>编辑轴数据</title>
<link rel="stylesheet" href="xuanlun.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .edit-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .img-half {
    flex: 1; min-height: 0; background: #1b1f24; color: #9aa4b2;
    position: relative; overflow: hidden;
  }
  .viewer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  .viewer img { max-width: none; max-height: none; width: 100%; height: auto; transform-origin: center center; will-change: transform; }
  .viewer .ph { font-size: 13px; text-align: center; line-height: 1.8; padding: 20px; }
  .tag-btn {
    position: absolute; left: 10px; top: 10px; z-index: 5;
    background: rgba(0,0,0,.55); color: #e6edf3; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .tag-btn:active { background: rgba(0,0,0,.75); }
  .hint-chip {
    position: absolute; right: 10px; top: 10px; z-index: 5; font-size: 11px;
    color: #c9d1d9; background: rgba(0,0,0,.35); border-radius: 999px; padding: 5px 10px;
  }
  .form-half { flex: 1; min-height: 0; overflow-y: auto; background: #f5f6f8; padding: 10px 12px 16px; }
  .rec-banner {
    font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px;
    background: #eef1ff; color: #2f45b5; border: 1px solid #dbe2ff;
  }
  .rec-banner.ok { background: #e9f7ef; color: #1a7f37; border-color: #c6e9d3; }
  .rec-banner.bad { background: #fdecec; color: #c0392b; border-color: #f5c6c6; }
  .grp { background: #fff; border: 1px solid #e5e8ec; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .grp h4 { font-size: 13px; margin-bottom: 8px; color: #333; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cell { display: flex; flex-direction: column; gap: 3px; }
  .cell label { font-size: 11px; color: #666; }
  .cell input, .cell select { border: 1px solid #d0d7de; border-radius: 7px; padding: 7px 8px; font-size: 13px; background: #fff; width: 100%; }
  .actbar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 8px 0 0; background: linear-gradient(#f5f6f8, #f5f6f8 70%); }
  .actbar button { flex: 1; }
  .warn { font-size: 11px; color: #c0392b; margin: 4px 2px; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="icon-btn" id="btnBack" title="返回作业详情">‹</button>
    <div class="title small" id="barTitle">编辑</div>
    <div style="width:36px"></div>
  </div>

  <div class="edit-wrap">
    <div class="img-half" id="imgHalf">
      <div class="viewer" id="viewer">
        <div class="ph" id="imgPh">尚未上传照片<br><span style="font-size:11px;opacity:.7">（上传后此处显示图片）</span></div>
      </div>
      <button class="tag-btn hidden" id="imgToggle">显示原图</button>
      <div class="hint-chip">双指缩放 / 拖动查看</div>
    </div>

    <div class="form-half">
      <div class="rec-banner" id="recBanner"></div>

      <div class="grp">
        <h4>基本信息</h4>
        <div class="grid2">
          <div class="cell"><label>方向（A-B / B-A）</label>
            <select id="inDir"><option value="A-B">A-B</option><option value="B-A">B-A</option></select>
          </div>
          <div class="cell"><label>轮对ID（识别所得，仅供参考）</label>
            <input id="inAxleId" placeholder="如 04B047-3">
          </div>
        </div>
        <div class="warn" id="warn"></div>
      </div>

      <div class="grp">
        <h4>车轮镟修前测量尺寸</h4>
        <div class="grid2">
          <div class="cell"><label>轮缘高度 · 左轮</label><input id="bl_lh" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>轮缘高度 · 右轮</label><input id="br_lh" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>轮缘厚度 · 左轮</label><input id="bl_le" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>轮缘厚度 · 右轮</label><input id="br_le" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>直径 · 左轮</label><input id="bl_dia" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>直径 · 右轮</label><input id="br_dia" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>径向跳动量 · 左轮</label><input id="bl_rt" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>径向跳动量 · 右轮</label><input id="br_rt" inputmode="decimal" placeholder="mm"></div>
        </div>
      </div>

      <div class="grp">
        <h4>车轮镟修后测量尺寸</h4>
        <div class="grid2">
          <div class="cell"><label>轮缘高度 · 左轮</label><input id="al_lh" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>轮缘高度 · 右轮</label><input id="ar_lh" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>轮缘厚度 · 左轮</label><input id="al_le" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>轮缘厚度 · 右轮</label><input id="ar_le" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>直径 · 左轮</label><input id="al_dia" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>直径 · 右轮</label><input id="ar_dia" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>径向跳动量 · 左轮</label><input id="al_rt" inputmode="decimal" placeholder="mm"></div>
          <div class="cell"><label>径向跳动量 · 右轮</label><input id="ar_rt" inputmode="decimal" placeholder="mm"></div>
        </div>
      </div>

      <div class="actbar">
        <button class="ghost" id="btnCancel">取消</button>
        <button class="primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

<script src="xuanlun-common.js"></script>
<script>
(function () {
  'use strict';
  var parts = decodeURIComponent((location.hash || '').replace(/^#/, '')).split('|');
  var jobId = parts[0], sec = parts[1], axleId = parts[2];
  var data = XL.load();
  var job = XL.getJob(data, jobId);
  if (!job || !sec || !axleId) { alert('参数错误'); location.replace('xuanlun.html'); return; }
  XL.ensureJob(job);
  var sh = job.sheets[sec];
  var ax = sh.axles[axleId] || (sh.axles[axleId] = { dir: 'A-B', data: null });
  var d = ax.data || {};
  var before = d.before || {}, after = d.after || {};

  document.getElementById('barTitle').textContent = '编辑 · ' + axleId;
  document.getElementById('inDir').value = ax.dir || 'A-B';
  document.getElementById('inAxleId').value = d.axleId || '';

  function setv(id, v) { document.getElementById(id).value = (v === undefined || v === null) ? '' : v; }
  function getv(id) { return (document.getElementById(id).value || '').trim(); }

  setv('bl_lh', before.left && before.left.lh); setv('br_lh', before.right && before.right.lh);
  setv('bl_le', before.left && before.left.le); setv('br_le', before.right && before.right.le);
  setv('bl_dia', before.left && before.left.dia); setv('br_dia', before.right && before.right.dia);
  setv('bl_rt', before.left && before.left.rt); setv('br_rt', before.right && before.right.rt);
  setv('al_lh', after.left && after.left.lh); setv('ar_lh', after.right && after.right.lh);
  setv('al_le', after.left && after.left.le); setv('ar_le', after.right && after.right.le);
  setv('al_dia', after.left && after.left.dia); setv('ar_dia', after.right && after.right.dia);
  setv('al_rt', after.left && after.left.rt); setv('ar_rt', after.right && after.right.rt);

  // ---------- 识别状态 ----------
  var banner = document.getElementById('recBanner');
  if (ax.recStatus === 'ok') {
    banner.className = 'rec-banner ok';
    banner.textContent = '识别成功' + (ax.recModel ? '（模型：' + ax.recModel + '）' : '') + '，请核对下方数据后保存。';
  } else if (ax.recStatus === 'fail') {
    banner.className = 'rec-banner bad';
    banner.textContent = '识别失败：' + (ax.recError || '未知原因') + '。可手动填写，或返回后重新上传照片。';
  } else if (ax.recStatus === 'pending') {
    banner.className = 'rec-banner';
    banner.textContent = '识别中…若长时间无结果，请返回后重新上传。';
  } else if (ax.imagePath) {
    banner.className = 'rec-banner';
    banner.textContent = '已上传图片（未识别），可手动填写。';
  } else {
    banner.className = 'rec-banner';
    banner.textContent = '尚未上传照片，可手动填写数据。';
  }

  // ---------- 一致性提醒 ----------
  var warns = [];
  if (d.axleId && d.axleId !== axleId) warns.push('识别轮对ID（' + d.axleId + '）与当前轴位（' + axleId + '）不一致。');
  if (d.carId && job.car && d.carId !== job.car) warns.push('识别车辆ID（' + d.carId + '）与作业车号（' + job.car + '）不一致。');
  if (warns.length) document.getElementById('warn').textContent = warns.join(' ');

  // ---------- 图片预览（双指缩放 / 拖动 / 原图切换） ----------
  var imgEl = null, srcEnh = '', srcOrig = '', showingOrig = false;
  var viewer = document.getElementById('viewer');
  var ph = document.getElementById('imgPh');
  var toggle = document.getElementById('imgToggle');

  function fetchImg(p) {
    try {
      var r = JSON.parse(HRBridge.xuanlunImageData(p));
      return (r && r.ok) ? r.dataUrl : '';
    } catch (e) { return ''; }
  }

  if (ax.imagePath && window.HRBridge && HRBridge.xuanlunImageData) {
    srcEnh = fetchImg(ax.imagePath);
    if (srcEnh) {
      imgEl = document.createElement('img');
      imgEl.src = srcEnh;
      imgEl.draggable = false;
      viewer.appendChild(imgEl);
      ph.style.display = 'none';
      if (ax.origPath) {
        srcOrig = fetchImg(ax.origPath);
        if (srcOrig) {
          toggle.classList.remove('hidden');
          toggle.textContent = '显示原图';
          toggle.onclick = function () {
            showingOrig = !showingOrig;
            imgEl.src = showingOrig ? srcOrig : srcEnh;
            toggle.textContent = showingOrig ? '显示增强图' : '显示原图';
            resetView();
          };
        }
      }
    } else {
      ph.textContent = '图片读取失败';
    }
  }

  var scale = 1, tx = 0, ty = 0, mode = 0, baseScale = 1, baseTx = 0, baseTy = 0, startDist = 0, startX = 0, startY = 0;
  function clampScale(s) { return Math.min(6, Math.max(1, s)); }
  function applyT() { if (imgEl) imgEl.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function resetView() { scale = 1; tx = 0; ty = 0; applyT(); }
  function dist2(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  viewer.addEventListener('touchstart', function (e) {
    if (!imgEl) return;
    if (e.touches.length === 2) {
      mode = 2; startDist = dist2(e.touches); baseScale = scale; baseTx = tx; baseTy = ty;
    } else if (e.touches.length === 1) {
      mode = 1; startX = e.touches[0].clientX; startY = e.touches[0].clientY; baseTx = tx; baseTy = ty;
    }
  }, { passive: true });
  viewer.addEventListener('touchmove', function (e) {
    if (!imgEl || !mode) return;
    if (mode === 2 && e.touches.length === 2) {
      var dd = dist2(e.touches);
      scale = clampScale(baseScale * (dd / (startDist || 1)));
      applyT(); e.preventDefault();
    } else if (mode === 1 && e.touches.length === 1) {
      tx = baseTx + (e.touches[0].clientX - startX);
      ty = baseTy + (e.touches[0].clientY - startY);
      applyT(); e.preventDefault();
    }
  }, { passive: false });
  viewer.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) { mode = 0; }
    else if (e.touches.length === 1) {
      mode = 1; startX = e.touches[0].clientX; startY = e.touches[0].clientY; baseTx = tx; baseTy = ty; startDist = 0;
    }
  }, { passive: true });
  viewer.addEventListener('dblclick', function () { resetView(); });

  // ---------- 保存 ----------
  document.getElementById('btnBack').onclick = function () { history.back(); };
  document.getElementById('btnCancel').onclick = function () { history.back(); };

  document.getElementById('btnSave').onclick = function () {
    var dir = document.getElementById('inDir').value;
    var dataObj = {
      axleId: getv('inAxleId'),
      before: {
        left: { lh: getv('bl_lh'), le: getv('bl_le'), dia: getv('bl_dia'), rt: getv('bl_rt') },
        right: { lh: getv('br_lh'), le: getv('br_le'), dia: getv('br_dia'), rt: getv('br_rt') }
      },
      after: {
        left: { lh: getv('al_lh'), le: getv('al_le'), dia: getv('al_dia'), rt: getv('al_rt') },
        right: { lh: getv('ar_lh'), le: getv('ar_le'), dia: getv('ar_dia'), rt: getv('ar_rt') }
      }
    };
    var any = false;
    ['before', 'after'].forEach(function (k) {
      ['left', 'right'].forEach(function (s2) {
        ['lh', 'le', 'dia', 'rt'].forEach(function (f) { if (dataObj[k][s2][f]) any = true; });
      });
    });
    ax.dir = dir;
    ax.data = any ? dataObj : null;
    XL.save(data);
    history.back();
  };
})();
</script>
</body>
</html>
